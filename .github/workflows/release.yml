name: Auto Release

on:
  push:
    branches:
      - main

concurrency:
  group: x-autopost-release
  cancel-in-progress: false

permissions:
  contents: write # リリース作成／アセット管理に必要
  packages: write # （必要

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Determine release version
        id: version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          major_minor="${package_version%.*}"
          escaped_major_minor="${major_minor//./\\.}"
          latest_tag=$(
            git tag -l "v${major_minor}.*" --sort=-v:refname \
              | grep -E "^v${escaped_major_minor}\\.[0-9]+$" \
              | head -n 1 \
              || true
          )

          if [ -z "$latest_tag" ]; then
            npm_version="$package_version"
          else
            patch="${latest_tag##*.}"
            npm_version="${major_minor}.$((patch + 1))"
          fi

          version="v$npm_version"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_name=x-autopost-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Set version and build bundle
        run: |
          npm version "${{ steps.version.outputs.npm_version }}" --no-git-tag-version
          npm run release

      - name: Archive build output
        run: |
          mkdir -p release
          zip -r "release/${{ steps.version.outputs.asset_name }}" dist code.js

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/${{ steps.version.outputs.asset_name }}
          asset_name: ${{ steps.version.outputs.asset_name }}
          asset_content_type: application/zip
